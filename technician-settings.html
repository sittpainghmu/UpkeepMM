  <body class="bg-background text-on-surface">

            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFohHwcsWooxw5lR8Ga3AWAOWyGs7yTzQkkFWwwS8mDKL3abg34zlEv5iNdgyoDiqlHLzTZMx_hwf8NLNmqKBihAcpQn-sOifHZkalvAc2ZoVU6Kuk1K0Eq-9XYff6qsQO7ihUjyS7m7L18E6QWwQXvXyV8GQCYo1ktVBVTVtjmi0NzzjSUkMoq1FdI3HhUk1z7zTh-ORqAo442rsDLMGbXMeMQS0A0FLzN6a7cKYjDaIqNvzIx3GnSWlAvNvhAS1mk5DENcBpcaE"

    <!-- Main Content Area -->
    <main class="ml-[260px] pt-16 min-h-screen">

            </div>
            <div class="flex flex-col md:flex-row gap-xl items-start">
              <div class="relative group">
                <img

                  data-alt="A high-quality close-up portrait of a male technician with a warm, professional smile. He wears a high-visibility navy work shirt. The scene is bright and airy, representing an efficient and modern workspace. The photo has a shallow depth of field, with soft corporate office lighting that aligns with a premium software interface."

                  </div>

                    <label

                    >
                    <input
                      class="w-full px-md py-sm border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-sm text-body-sm outline-none transition-all"

                    placeholder="••••••••••••"
                    type="password"
                  />
                </div>
                <div class="flex flex-col gap-xs">
                  <label
                    class="font-label-uppercase text-label-uppercase text-on-surface-variant"

              Cancel

            <button
              class="px-xl py-md bg-primary text-on-primary font-body-base text-body-base rounded-lg shadow-sm hover:opacity-90 transition-all active:scale-95 flex items-center gap-sm"

        <!-- Status Message (Toast style, hidden by default) -->
        <div
          class="fixed bottom-lg right-lg bg-inverse-surface text-inverse-on-surface px-lg py-md rounded-xl shadow-xl flex items-center gap-md transform translate-y-24 transition-transform duration-300 pointer-events-none opacity-0"
          id="toast"
        >
          <span
            class="material-symbols-outlined text-primary-fixed"
            data-icon="check_circle"
            >check_circle</span
          >
          <span class="font-body-base text-body-base"
            >Changes saved successfully!</span
          >
        </div>
      </div>

    <script>
      // Micro-interaction for form submission
      const form = document.getElementById("settings-form");
      const toast = document.getElementById("toast");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        // Visual feedback for save
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalContent = submitBtn.innerHTML;

        submitBtn.innerHTML =
          '<span class="material-symbols-outlined animate-spin" data-icon="autorenew">autorenew</span> Saving...';
        submitBtn.disabled = true;

        setTimeout(() => {
          submitBtn.innerHTML = originalContent;
          submitBtn.disabled = false;

          // Show success toast
          toast.classList.remove("translate-y-24", "opacity-0");
          toast.classList.add("translate-y-0", "opacity-100");

          setTimeout(() => {
            toast.classList.add("translate-y-24", "opacity-0");
            toast.classList.remove("translate-y-0", "opacity-100");
          }, 3000);
        }, 800);
      });

      // Hover effect on the side nav active state (extra flair)
      const activeNav = document.querySelector(".bg-secondary-container");
      activeNav.addEventListener("mouseenter", () => {
        activeNav.classList.add("brightness-110");
      });
      activeNav.addEventListener("mouseleave", () => {
        activeNav.classList.remove("brightness-110");
      });
    </script>
  
  <script>
    document.querySelectorAll('nav a').forEach(a => {
      const t = a.textContent.trim();
      if (t === 'All Jobs') a.href = 'technician-portal.html';
      if (t === 'Logout')   a.href = 'log-in.html';
    });
  </script>

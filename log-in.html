    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

  <body
    class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop"
  >
    <!-- Login Container -->
    <main class="w-full max-w-[440px] flex flex-col items-center">
      <!-- Brand Identity Section -->
      <div class="mb-xl text-center">
        <div
          class="inline-flex items-center justify-center w-12 h-12 bg-primary rounded-lg mb-md"
        >
          <span class="material-symbols-outlined text-on-primary text-[28px]"
            >precision_manufacturing</span
          >
        </div>
        <h1 class="font-display-lg text-display-lg text-primary tracking-tight">
          UpKeep MM
        </h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">
          Yangon Maintenance Management System
        </p>
      </div>
      <!-- Login Card -->
      <div
        class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-lg md:p-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)]"
      >
        <form action="log-in-role.html" class="space-y-lg" method="GET">
          <!-- Email Field -->
          <div class="space-y-xs">
            <label
              class="font-label-uppercase text-label-uppercase text-on-surface-variant block uppercase"
              for="email"
            >
              Email Address
            </label>
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none"
              >
                <span
                  class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]"
                  >mail</span
                >
              </div>
              <input
                class="w-full pl-xl pr-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                id="email"
                name="email"
                placeholder="  name@yangonbiz.mm"
                required=""
                type="email"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="space-y-xs">
            <div class="flex justify-between items-center">
              <label
                class="font-label-uppercase text-label-uppercase text-on-surface-variant block uppercase"
                for="password"
              >
                Password
              </label>
              <a
                class="font-label-uppercase text-label-uppercase text-primary hover:text-secondary transition-colors uppercase"
                href="#"
              >
                Forgot Password?
              </a>
            </div>
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none"
              >
                <span
                  class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px]"
                  >lock</span
                >
              </div>
              <input
                class="w-full pl-xl pr-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                id="password"
                name="password"
                placeholder="  ••••••••"
                required=""
                type="password"
              />
            </div>
          </div>
          <!-- Remember Me -->
          <div class="flex items-center space-x-sm">
            <input
              class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary focus:ring-offset-surface cursor-pointer"
              id="remember"
              name="remember"
              type="checkbox"
            />
            <label
              class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none"
              for="remember"
            >
              Keep me signed in
            </label>
          </div>
          <!-- Action Button -->
          <button
            class="w-full bg-primary text-on-primary py-md px-lg rounded-DEFAULT font-label-uppercase text-label-uppercase uppercase tracking-wider hover:bg-secondary-container transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 active:opacity-80 flex justify-center items-center gap-sm"
            type="submit"
          >
            Sign In
            <span class="material-symbols-outlined text-[18px]">login</span>
          </button>
        </form>
      </div>
      <!-- Utility Decorative Section -->
      <div
        class="mt-xl grid grid-cols-3 gap-md w-full max-w-[320px] opacity-40 grayscale group-hover:grayscale-0 transition-all"
      >
        <div class="h-1 bg-outline-variant rounded-full"></div>
        <div class="h-1 bg-outline-variant rounded-full"></div>
        <div class="h-1 bg-outline-variant rounded-full"></div>

          src="https://lh3.googleusercontent.com/aida-public/AB6AXuA3EvdVQnMz9BVS-1gBSdQVMLMxoQxK3tuMeSqLoxWZKSx-fV4cZFjs6VRWOsTig5vb4iP78W1kxHlRSIgEwghBXY-F3wcZ_C3MVocg8-YIR6f1qVnPuh1AT1HLHHuBokNnQwF6_eM2V6zSz4fEIrSfqkztkH9zsbqqtgkc6931bs1o2Mz284p0zLy7lTHq7TnzIFRC9Ge0OGSBEY7t5_nCE9cYVUOoSijNp1fK4_MU4DZzKYoxqO8AMIIvg4Vc9hALP-1r_Oap3Ck"
        />

    <script>
      document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();
        location.href = "log-in-role.html";
      });
    </script>
    <script src="prototype-flow.js"></script>

<!doctype html>
<html class="light" lang="en" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>UpKeep MM - Client Settings</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#f9f9ff",
              "on-tertiary-fixed": "#390c00",
              "primary-container": "#1d4ed8",
              "inverse-on-surface": "#edf0ff",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dce1ff",
              "on-surface-variant": "#434655",
              "surface-tint": "#2151da",
              tertiary: "#7f2500",
              "surface-container-highest": "#dce2f7",
              "on-secondary-fixed": "#00174b",
              "tertiary-fixed-dim": "#ffb59c",
              "surface-container-high": "#e1e8fd",
              "inverse-primary": "#b7c4ff",
              "surface-variant": "#dce2f7",
              "on-surface": "#141b2b",
              "surface-bright": "#f9f9ff",
              "outline-variant": "#c4c5d7",
              "on-secondary-fixed-variant": "#003ea8",
              "on-primary-container": "#cad3ff",
              "on-primary": "#ffffff",
              background: "#f9f9ff",
              "inverse-surface": "#293040",
              "secondary-fixed-dim": "#b4c5ff",
              error: "#ba1a1a",
              outline: "#747686",
              "on-tertiary-fixed-variant": "#832700",
              "tertiary-fixed": "#ffdbcf",
              "secondary-fixed": "#dbe1ff",
              "secondary-container": "#316bf3",
              "tertiary-container": "#a73400",
              "on-primary-fixed-variant": "#0039b5",
              "surface-container-low": "#f1f3ff",
              secondary: "#0051d5",
              primary: "#0037b0",
              "on-primary-fixed": "#001551",
              "error-container": "#ffdad6",
              "surface-container": "#e9edff",
              "on-secondary-container": "#fefcff",
              "on-error": "#ffffff",
              "primary-fixed-dim": "#b7c4ff",
              "on-background": "#141b2b",
              "surface-dim": "#d3daef",
              "on-secondary": "#ffffff",
              "on-error-container": "#93000a",
              "on-tertiary-container": "#ffc9b7",
              "on-tertiary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              lg: "24px",
              "margin-desktop": "32px",
              xs: "4px",
              xl: "32px",
              sm: "8px",
              md: "16px",
              base: "4px",
              "margin-mobile": "16px",
              gutter: "24px",
            },
            fontFamily: {
              "body-sm": ["Inter"],
              "headline-md": ["Inter"],
              "display-lg": ["Inter"],
              "label-uppercase": ["Inter"],
              "title-sm": ["Inter"],
              "body-base": ["Inter"],
              "data-tabular": ["Inter"],
            },
            fontSize: {
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "display-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "label-uppercase": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "title-sm": ["18px", { lineHeight: "28px", fontWeight: "600" }],
              "body-base": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "data-tabular": [
                "14px",
                { lineHeight: "20px", fontWeight: "500" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        background-color: #f9f9ff;
        color: #141b2b;
        font-family: "Inter", sans-serif;
      }
      .settings-input {
        @apply w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all duration-200 text-body-sm text-on-surface;
      }
      .bento-card {
        @apply bg-surface-container-lowest rounded-xl p-xl border border-outline-variant/40 shadow-sm transition-all duration-300;
      }
      .form-label {
        @apply font-medium text-[12px] text-on-surface-variant mb-2 block tracking-tight;
      }
    </style>
  </head>
  <body class="bg-surface font-body-base text-on-surface">
    <!-- Shared SideNavBar -->
    <aside
      class="fixed left-0 top-0 h-full w-[260px] bg-surface-container-lowest dark:bg-surface-dim border-r border-outline-variant dark:border-outline flex flex-col py-lg z-50"
    >
      <div class="px-6 mb-10">
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 bg-primary rounded flex items-center justify-center text-on-primary"
          >
            <span class="material-symbols-outlined text-[20px]"
              >construction</span
            >
          </div>
          <div>
            <h1
              class="font-headline-md text-headline-md font-black text-primary dark:text-primary-fixed-dim"
            >
              UpKeep MM
            </h1>
            <p
              class="font-label-uppercase text-label-uppercase text-on-surface-variant opacity-70"
            >
              Client Portal
            </p>
          </div>
        </div>
      </div>
      <nav class="flex-1 space-y-1">
        <a
          class="flex items-center gap-3 px-4 py-3 text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all duration-200"
          href="client-portal.html"
          ><span class="material-symbols-outlined">assignment</span
          ><span class="font-label-uppercase text-label-uppercase"
            >My Requests</span
          ></a
        ><a
          class="flex items-center gap-3 px-4 py-3 text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-variant transition-all duration-200"
          href="client-request.html"
          ><span class="material-symbols-outlined">add_box</span
          ><span class="font-label-uppercase text-label-uppercase"
            >New Request</span
          ></a
        ><a
          class="flex items-center gap-3 px-4 py-3 bg-primary-fixed text-on-primary-fixed border-l-[3px] border-primary font-bold transition-all duration-200"
          href="client-settings.html"
          ><span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >settings</span
          ><span class="font-label-uppercase text-label-uppercase"
            >Settings</span
          ></a
        >
      </nav>
      <div class="mt-auto px-4">
        <a
          class="flex items-center gap-3 px-4 py-3 text-error hover:bg-error-container hover:bg-opacity-10 rounded-lg transition-all duration-200"
          href="log-in.html"
          ><span class="material-symbols-outlined">logout</span
          ><span class="font-label-uppercase text-label-uppercase"
            >Logout</span
          ></a
        >
      </div>
    </aside>
    <!-- Shared TopNavBar -->
    <header
      class="fixed top-0 right-0 left-[260px] h-16 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-desktop w-full z-40 h-20"
    >
      <div class="flex items-center gap-4">
        <h2
          class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim"
        >
          Settings
        </h2>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <button
            class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors"
          >
            <span class="material-symbols-outlined">notifications</span></button
          ><button
            class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors"
          >
            <span class="material-symbols-outlined">help</span>
          </button>
        </div>
        <div class="h-8 w-[1px] bg-outline-variant"></div>
        <div class="flex items-center gap-4 h-full pr-8">
          <button
            class="px-6 h-10 border border-outline-variant text-on-surface-variant rounded-lg font-label-uppercase text-label-uppercase hover:bg-surface-container-low hover:text-on-surface active:scale-95 transition-all flex items-center justify-center"
            style="transform: scale(1)"
          >
            Cancel Changes
          </button>
          <button
            class="bg-[#1d4ed8] text-white px-6 h-10 rounded-lg font-label-uppercase text-label-uppercase flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-sm"
          >
            Save Changes
          </button>
        </div>
      </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="ml-[260px] min-h-screen pt-8">
      <div class="p-lg max-w-5xl mx-auto w-full flex flex-col gap-lg mt-16">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- Organization Details -->
          <section
            class="flex flex-col gap-6 bg-surface-container-lowest p-8 rounded-xl border border-outline-variant/30 shadow-sm"
          >
            <div
              class="flex items-center gap-3 border-b border-outline-variant/20 pb-4 mb-2"
            >
              <span class="material-symbols-outlined text-primary text-[20px]"
                >business</span
              >
              <h3 class="font-title-sm text-title-sm text-on-surface">
                Organization Details
              </h3>
            </div>
            <div class="space-y-6">
              <div class="flex flex-col gap-2">
                <label
                  class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                  >Organization Name</label
                >
                <input
                  class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none transition-all"
                  type="text"
                  value="Innovate Global Corp"
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                  >Headquarters Address</label
                >
                <textarea
                  class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none resize-none transition-all"
                  rows="3"
                >
123 Corporate Blvd, NY</textarea
                >
              </div>
            </div>
          </section>

          <!-- Contact Details -->
          <section
            class="flex flex-col gap-6 bg-surface-container-lowest p-8 rounded-xl border border-outline-variant/30 shadow-sm"
          >
            <div
              class="flex items-center gap-3 border-b border-outline-variant/20 pb-4 mb-2"
            >
              <span class="material-symbols-outlined text-primary text-[20px]"
                >contact_page</span
              >
              <h3 class="font-title-sm text-title-sm text-on-surface">
                Contact Details
              </h3>
            </div>
            <div class="space-y-6">
              <div class="flex flex-col gap-2">
                <label
                  class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                  >Primary Contact Name</label
                >
                <input
                  class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none transition-all"
                  type="text"
                  value="Alex Rivera"
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                  >Email Address</label
                >
                <input
                  class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none transition-all"
                  type="email"
                  value="a.rivera@innovateglobal.com"
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                  >Phone Number</label
                >
                <input
                  class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none transition-all"
                  type="tel"
                  value="1 (555) 000-0000"
                />
              </div>
            </div>
          </section>

          <!-- Display -->
          <section
            class="flex flex-col gap-6 bg-surface-container-lowest p-8 rounded-xl border border-outline-variant/30 shadow-sm"
          >
            <div
              class="flex items-center gap-3 border-b border-outline-variant/20 pb-4 mb-2"
            >
              <span class="material-symbols-outlined text-primary text-[20px]"
                >palette</span
              >
              <h3 class="font-title-sm text-title-sm text-on-surface">
                Display
              </h3>
            </div>
            <div class="flex flex-col gap-2">
              <label
                class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                >System Theme</label
              >
              <select
                class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none cursor-pointer transition-all"
              >
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
                <option value="system">System Default</option>
              </select>
            </div>
          </section>

          <!-- Language -->
          <section
            class="flex flex-col gap-6 bg-surface-container-lowest p-8 rounded-xl border border-outline-variant/30 shadow-sm"
          >
            <div
              class="flex items-center gap-3 border-b border-outline-variant/20 pb-4 mb-2"
            >
              <span class="material-symbols-outlined text-primary text-[20px]"
                >language</span
              >
              <h3 class="font-title-sm text-title-sm text-on-surface">
                Language
              </h3>
            </div>
            <div class="flex flex-col gap-2">
              <label
                class="font-label-uppercase text-label-uppercase text-on-surface-variant tracking-wider"
                >Select Language</label
              >
              <select
                class="bg-surface-container-low border border-outline-variant/40 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg px-4 py-3 font-body-sm text-body-sm outline-none cursor-pointer transition-all"
              >
                <option value="en">English (United States)</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
              </select>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script>
      // Micro-interaction for buttons
      document.querySelectorAll("button, a").forEach((el) => {
        el.addEventListener("mousedown", () => {
          el.style.transform = "scale(0.98)";
        });
        el.addEventListener("mouseup", () => {
          el.style.transform = "scale(1)";
        });
      });

      // Language select interaction
      const selects = document.querySelectorAll("select");
      selects.forEach((select) => {
        select.addEventListener("focus", () => {
          select.parentElement.querySelector(
            ".material-symbols-outlined",
          ).style.transform = "translateY(-50%) rotate(180deg)";
        });
        select.addEventListener("blur", () => {
          select.parentElement.querySelector(
            ".material-symbols-outlined",
          ).style.transform = "translateY(-50%) rotate(0deg)";
        });
      });
    </script>
  
  <script>
    document.querySelectorAll('nav a').forEach(a => {
      const t = a.textContent.trim();
      if (t === 'My Requests') a.href = 'client-portal.html';
      if (t === 'New Request') a.href = 'client-request.html';
      if (t === 'Logout')      a.href = 'log-in.html';
    });
  </script>
  <script src="prototype-flow.js"></script>
  </body>
</html>

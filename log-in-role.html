<!doctype html>
<html class="light" lang="en" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>UpKeep MM - Select Role</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed": "#ffdbcf",
              "surface-container-lowest": "#ffffff",
              error: "#ba1a1a",
              "outline-variant": "#c4c5d7",
              "error-container": "#ffdad6",
              "surface-container": "#e9edff",
              "on-surface-variant": "#434655",
              "surface-container-highest": "#dce2f7",
              "tertiary-container": "#a73400",
              surface: "#f9f9ff",
              "on-tertiary-fixed": "#390c00",
              "on-background": "#141b2b",
              "secondary-fixed-dim": "#b4c5ff",
              "on-secondary": "#ffffff",
              "surface-bright": "#f9f9ff",
              "on-error-container": "#93000a",
              "surface-container-high": "#e1e8fd",
              "tertiary-fixed-dim": "#ffb59c",
              "on-secondary-fixed-variant": "#003ea8",
              "on-primary-container": "#cad3ff",
              "inverse-on-surface": "#edf0ff",
              tertiary: "#7f2500",
              "secondary-fixed": "#dbe1ff",
              primary: "#0037b0",
              "on-error": "#ffffff",
              "surface-tint": "#2151da",
              "on-secondary-container": "#fefcff",
              "on-primary-fixed-variant": "#0039b5",
              "on-primary-fixed": "#001551",
              "primary-container": "#1d4ed8",
              "inverse-primary": "#b7c4ff",
              "on-tertiary-fixed-variant": "#832700",
              "on-secondary-fixed": "#00174b",
              "primary-fixed-dim": "#b7c4ff",
              "primary-fixed": "#dce1ff",
              "on-primary": "#ffffff",
              "surface-dim": "#d3daef",
              "inverse-surface": "#293040",
              "on-tertiary": "#ffffff",
              background: "#f9f9ff",
              "surface-variant": "#dce2f7",
              secondary: "#0051d5",
              "on-surface": "#141b2b",
              outline: "#747686",
              "surface-container-low": "#f1f3ff",
              "on-tertiary-container": "#ffc9b7",
              "secondary-container": "#316bf3",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              lg: "24px",
              gutter: "24px",
              xs: "4px",
              "margin-desktop": "32px",
              xl: "32px",
              md: "16px",
              sm: "8px",
              base: "4px",
              "margin-mobile": "16px",
            },
            fontFamily: {
              "body-sm": ["Inter"],
              "display-lg": ["Inter"],
              "data-tabular": ["Inter"],
              "body-base": ["Inter"],
              "title-sm": ["Inter"],
              "label-uppercase": ["Inter"],
              "headline-md": ["Inter"],
            },
            fontSize: {
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "display-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "data-tabular": [
                "14px",
                { lineHeight: "20px", fontWeight: "500" },
              ],
              "body-base": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "title-sm": ["18px", { lineHeight: "28px", fontWeight: "600" }],
              "label-uppercase": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #f9f9ff;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center"
  >
    <!-- Top Branding Anchor -->
    <header
      class="fixed top-0 w-full flex justify-center py-xl bg-surface/80 backdrop-blur-md z-10"
    >
      <div class="flex flex-col items-center">
        <h1
          class="font-display-lg text-display-lg font-bold text-primary tracking-tight"
        >
          UpKeep MM
        </h1>
        <p
          class="font-label-uppercase text-label-uppercase text-on-surface-variant mt-xs"
        >
          Enterprise Management
        </p>
      </div>
    </header>
    <main
      class="w-full max-w-7xl px-margin-mobile md:px-margin-desktop mt-32 mb-16"
    >
      <div class="text-center mb-xl">
        <h2 class="font-headline-md text-headline-md text-on-surface mb-sm">
          Please Select Your Role
        </h2>
        <p
          class="font-body-base text-body-base text-on-surface-variant max-w-2xl mx-auto"
        >
          <br />
        </p>
      </div>
      <!-- Role Selection Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-lg h-full">
        <!-- Admin Role Card -->
        <button
          onclick="location.href='admin-portal.html'"
          class="group relative flex flex-col items-start p-xl bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-300 hover:border-primary hover:shadow-lg hover:-translate-y-1 text-left"
        >
          <div
            class="w-14 h-14 rounded-lg bg-primary-fixed flex items-center justify-center mb-lg transition-colors group-hover:bg-primary-container"
          >
            <span
              class="material-symbols-outlined text-primary group-hover:text-on-primary-container"
              style="font-size: 32px"
              >admin_panel_settings</span
            >
          </div>
          <h3 class="font-title-sm text-title-sm text-on-surface mb-sm">
            Admin
          </h3>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant mb-xl leading-relaxed"
          >
            Full access to system configuration, user management, and
            operational oversight.
          </p>
          <div
            class="mt-auto flex items-center text-primary font-body-sm font-semibold"
          >
            Enter Admin Portal
            <span
              class="material-symbols-outlined ml-xs transition-transform group-hover:translate-x-1"
              >arrow_forward</span
            >
          </div>
        </button>
        <!-- Technician Role Card -->
        <button
          onclick="location.href='technician-portal.html'"
          class="group relative flex flex-col items-start p-xl bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-300 hover:border-primary hover:shadow-lg hover:-translate-y-1 text-left"
        >
          <div
            class="w-14 h-14 rounded-lg bg-primary-fixed flex items-center justify-center mb-lg transition-colors group-hover:bg-primary-container"
          >
            <span
              class="material-symbols-outlined text-primary group-hover:text-on-primary-container"
              style="font-size: 32px"
              >engineering</span
            >
          </div>
          <h3 class="font-title-sm text-title-sm text-on-surface mb-sm">
            Technician
          </h3>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant mb-xl leading-relaxed"
          >
            View assigned work orders, update job statuses, and manage field
            tasks.
          </p>
          <div
            class="mt-auto flex items-center text-primary font-body-sm font-semibold"
          >
            Enter Technician Portal
            <span
              class="material-symbols-outlined ml-xs transition-transform group-hover:translate-x-1"
              >arrow_forward</span
            >
          </div>
        </button>
        <!-- Client Role Card -->
        <button
          onclick="location.href='client-portal.html'"
          class="group relative flex flex-col items-start p-xl bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-300 hover:border-primary hover:shadow-lg hover:-translate-y-1 text-left"
        >
          <div
            class="w-14 h-14 rounded-lg bg-primary-fixed flex items-center justify-center mb-lg transition-colors group-hover:bg-primary-container"
          >
            <span
              class="material-symbols-outlined text-primary group-hover:text-on-primary-container"
              style="font-size: 32px"
              >person</span
            >
          </div>
          <h3 class="font-title-sm text-title-sm text-on-surface mb-sm">
            Client
          </h3>
          <p
            class="font-body-sm text-body-sm text-on-surface-variant mb-xl leading-relaxed"
          >
            Submit new requests, monitor ongoing projects, and access support
            tools for your organization
          </p>
          <div
            class="mt-auto flex items-center text-primary font-body-sm font-semibold"
          >
            Enter Client Portal
            <span
              class="material-symbols-outlined ml-xs transition-transform group-hover:translate-x-1"
              >arrow_forward</span
            >
          </div>
        </button>
      </div>
      <!-- Footer Help Link -->
      <div class="mt-xl text-center">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Need help accessing your account?
          <a
            class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 transition-all"
            href="#"
            >Contact Support</a
          >
        </p>
      </div>
    </main>
    <!-- Background Decorative Elements -->
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
      <div
        class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed/20 blur-[120px] rounded-full"
      ></div>
      <div
        class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-fixed/20 blur-[120px] rounded-full"
      ></div>
    </div>
    <!-- Contextual Information (Bento Style Sub-section) -->
  
  <script>
    const cards = document.querySelectorAll('button');
    // Admin, Technician, Client (order in DOM)
    const targets = ['admin-portal.html', 'technician-portal.html', 'client-portal.html'];
    cards.forEach((btn, i) => {
      if (targets[i]) btn.addEventListener('click', () => location.href = targets[i]);
    });
  </script>
  <script src="prototype-flow.js"></script>
  </body>
</html>
